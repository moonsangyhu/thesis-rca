name: thesis
version: 0.1.0
description: "Agent-free /thesis Slack control-plane command. Signs a CommandEnvelope from the gateway-verified Slack request identity and calls the campaign Controller over its bounded Unix socket via Hermes's existing pre_gateway_dispatch plugin hook — never through the model/agent/Codex loop, and never by modifying Hermes itself."
author: thesis-rca
kind: standalone
platforms:
  - macos
  - linux
